services:
  postgres:
    profiles:
      - local-postgres

  migrator:
    environment:
      MEMORYSYSTEM_POSTGRES_CONNECTION_STRING: ${MEMORYSYSTEM_POSTGRES_CONNECTION_STRING:?Set MEMORYSYSTEM_POSTGRES_CONNECTION_STRING for MEMORYSYSTEM_POSTGRES_PROFILE=external}
    depends_on: !reset []

  api:
    environment:
      MEMORYSYSTEM_POSTGRES_CONNECTION_STRING: ${MEMORYSYSTEM_POSTGRES_CONNECTION_STRING:?Set MEMORYSYSTEM_POSTGRES_CONNECTION_STRING for MEMORYSYSTEM_POSTGRES_PROFILE=external}
    depends_on: !reset []

  worker:
    environment:
      MEMORYSYSTEM_POSTGRES_CONNECTION_STRING: ${MEMORYSYSTEM_POSTGRES_CONNECTION_STRING:?Set MEMORYSYSTEM_POSTGRES_CONNECTION_STRING for MEMORYSYSTEM_POSTGRES_PROFILE=external}
    depends_on: !reset []
