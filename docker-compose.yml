services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: ${MEMORYSYSTEM_POSTGRES_DB:-memory_system}
      POSTGRES_USER: ${MEMORYSYSTEM_POSTGRES_USER:-memory_system}
      POSTGRES_PASSWORD: ${MEMORYSYSTEM_POSTGRES_PASSWORD:-memory_system_dev_password}
    ports:
      - "${MEMORYSYSTEM_POSTGRES_PORT:-55432}:5432"
    volumes:
      - memorysystem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c \"SELECT 1;\" >/dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  memorysystem-postgres-data:
